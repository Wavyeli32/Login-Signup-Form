<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }

        header {
            background-color: black;
            color: white;
            text-align: center;
            padding: 1rem 0;
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        h1, h2 {
            color: #00c244;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            padding: 0.8rem;
            background: #f9f9f9;
            margin: 0.5rem 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            margin-left: 1rem;
            padding: 0.5rem;
            font-size: 1rem;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .student-list button {
            background-color: #2196F3;
        }

        .student-list button:hover {
            background-color: #1976D2;
        }

        .logout-button {
            background-color: #f44336;
            color: white;
            margin-top: 1rem;
            display: block;
            width: 100%;
            padding: 0.7rem;
            font-size: 1.2rem;
            text-align: center;
        }

        .logout-button:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>
    <header>
        <h1>Alumni Dashboard</h1>
    </header>

    <div class="container">
        <p>Welcome, <span id="mentorName">Loading...</span>! Here are your tasks and students:</p>

        <h2>Tasks</h2>
        <ul id="taskList">
            <li>Loading tasks...</li>
        </ul>

        <h2>Students</h2>
        <ul id="studentList">
            <li>Loading students...</li>
        </ul>

        <button onclick="startSession()">Start a Session</button>

        <div class="student-list">
            <h2>New Student Requests</h2>
            <ul id="newStudents">
                <li>Loading...</li>
            </ul>
        </div>

        <!-- Logout Button -->
        <button class="logout-button" onclick="logout()">Logout</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch("/mentor-dashboard")
                .then(res => res.json())
                .then(data => {
                    document.getElementById("mentorName").textContent = data.mentorName;
    
                    // Populate mentor tasks
                    const taskList = document.getElementById("taskList");
                    taskList.innerHTML = "";
                    data.tasks.forEach(task => {
                        taskList.innerHTML += `<li>${task} <button onclick="completeTask(this)">Complete</button></li>`;
                    });
    
                    // Populate students assigned to the mentor
                    const studentList = document.getElementById("studentList");
                    studentList.innerHTML = "";
                    data.students.forEach(student => {
                        studentList.innerHTML += `<li>${student.name} - Goal: ${student.goal}</li>`;
                    });
    
                    // Populate new student requests
                    const newStudents = document.getElementById("newStudents");
                    newStudents.innerHTML = "";
                    data.newStudentRequests.forEach(student => {
                        newStudents.innerHTML += `<li>${student.name} - Goal: ${student.goal} 
                        <button onclick="addStudent('${student._id}')">Add</button></li>`;
                    });
                })
                .catch(error => console.error("Error fetching data:", error));
        });
    
        // Function to mark a task as completed
        function completeTask(button) {
            button.parentElement.remove();
            alert("Task completed!");
        }
    
        // Function to start a mentorship session
        function startSession() {
            alert("Starting mentorship session...");
        }
    
        // Function to add a student to the mentor's list
        function addStudent(studentId) {
            fetch("/mentor/select-student", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({ studentId }),
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                location.reload(); // Reload to reflect the updated student list
            })
            .catch(error => console.error("Error adding student:", error));
        }

        // Logout function
        function logout() {
            // Clear session or authentication-related data if needed
            // Example: sessionStorage.clear(); or localStorage.clear();

            // Redirect to login page
            window.location.href = "login.html"; // Adjust the URL if needed
        }
    </script>
</body>
</html>
